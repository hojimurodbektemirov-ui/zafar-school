# Saytning frontend qismini GitHub Pages'ga avtomatik joylaydi (public/ papkasi).
# Backend (arizalar bazasi, admin panel) bu yerda ishlamaydi: unga server kerak (README'ga qarang).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ustozlar.json va tarjimalardan uz/ru/en sahifalarini qayta yig'adi
      - run: pip install beautifulsoup4 && python site/build_i18n.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
